# Data-classification taint rules — how Mosca's X gets scanner evidence.
#
# No scanner can know how long the data an artefact protects must stay secret.
# What a scanner CAN observe is what kind of data actually reaches a crypto call.
# These rules run in Semgrep taint mode: PII patterns are sources, crypto calls
# are sinks, and a reaching path attaches trinetra:data-category to the finding.
#
# THIS IS EVIDENCE OF WHAT THE CODE PROTECTS, NOT A BUSINESS DECISION.
# It enters the context chain at the `scanner_evidence` tier — below a user's
# confirmation, never above it. The Python schema enforces that a scanner may
# supply `data_category` and nothing else, so these rules cannot become a
# back-channel for facts no scanner can know.
#
# Taint mode matters: a rule that merely matched the name `aadhaar_number`
# anywhere would manufacture PII evidence from a name coincidence. Requiring a
# genuine source -> sink path is what makes this evidence rather than a guess.

rules:
  - id: trinetra-taint-aadhaar-to-crypto
    languages: [python, java, go, javascript, typescript]
    severity: INFO
    message: >-
      Aadhaar-like identifier reaches a cryptographic sink.
      trinetra:data_category=aadhaar_pii
    metadata:
      trinetra:
        data_category: aadhaar_pii
        confidence: medium
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: $OBJ.aadhaar_number
          - pattern: $OBJ.aadhaarNumber
          - pattern: $OBJ.get("aadhaar_number")
          - pattern: |
              aadhaar_number = ...
          - pattern: |
              aadhaarNumber = ...
    pattern-sinks:
      - pattern-either:
          - pattern: $C.encrypt(...)
          - pattern: $C.update(...)
          - pattern: $C.doFinal(...)
          - pattern: $C.Seal(...)
          - pattern: $C.sign(...)

