services:
  redis:
    image: redis:7-alpine
    container_name: trinetra-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - trinetra-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trinetra-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - TRINETRA_DATABASE_URL=sqlite:////data/trinetra.db
      - TRINETRA_AUTO_CREATE_SCHEMA=true
      - TRINETRA_JWT_SECRET=supersecret-change-this-in-production-jwt-token
      - BOOTSTRAP_ADMIN_USERNAME=admin
      - BOOTSTRAP_ADMIN_PASSWORD=adminpassword
      - TRINETRA_CORS_ORIGINS=http://localhost:3000,http://localhost:5173,http://localhost
      - TRINETRA_REPORT_STORE=/data/reports
      - TRINETRA_ARTIFACT_STORE=/artifact-store
      - TRINETRA_CELERY_BROKER_URL=redis://redis:6379/0
      - TRINETRA_CELERY_RESULT_BACKEND=redis://redis:6379/0
      - TRINETRA_WORKER_CONCURRENCY=4
    volumes:
      - trinetra-data:/data
      - trinetra-artifacts:/artifact-store
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trinetra-worker
    restart: unless-stopped
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=info"]
    environment:
      - TRINETRA_DATABASE_URL=sqlite:////data/trinetra.db
      - TRINETRA_REPORT_STORE=/data/reports
      - TRINETRA_ARTIFACT_STORE=/artifact-store
      - TRINETRA_CELERY_BROKER_URL=redis://redis:6379/0
      - TRINETRA_CELERY_RESULT_BACKEND=redis://redis:6379/0
      - TRINETRA_WORKER_CONCURRENCY=4
      - TRINETRA_TASK_TIME_LIMIT=3600
      - TRINETRA_TASK_SOFT_TIME_LIMIT=3300
    volumes:
      - trinetra-data:/data
      - trinetra-artifacts:/artifact-store
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: trinetra-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  trinetra-data:
  trinetra-artifacts:
  trinetra-redis-data:
