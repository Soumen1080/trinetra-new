apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "trinetra.fullname" . }}-api
  labels:
    {{- include "trinetra.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "trinetra.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "trinetra.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.api.service.port }}
              name: http
          envFrom:
            - configMapRef:
                name: {{ include "trinetra.fullname" . }}-config
            - secretRef:
                name: {{ include "trinetra.fullname" . }}-secret
          volumeMounts:
            - name: reports-volume
              mountPath: {{ .Values.config.reportStorePath }}
            - name: artifacts-volume
              mountPath: {{ .Values.config.artifactStorePath }}
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      volumes:
        - name: reports-volume
          persistentVolumeClaim:
            claimName: {{ include "trinetra.fullname" . }}-reports-pvc
        - name: artifacts-volume
          persistentVolumeClaim:
            claimName: {{ include "trinetra.fullname" . }}-artifacts-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "trinetra.fullname" . }}-api
  labels:
    {{- include "trinetra.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: {{ include "trinetra.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: api
